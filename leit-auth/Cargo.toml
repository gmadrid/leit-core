[package]
name = "leit-auth"
version = "0.1.0"
edition = "2024"
description = "Supabase + JWT auth primitives for Leitner-box study apps"

[features]
wasm = ["js-sys"]

[dependencies]
js-sys = { version = "0.3", optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
